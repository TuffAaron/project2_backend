# Test Database Configuration
# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Disable H2 console for tests
spring.h2.console.enabled=false

# Disable data loading for tests
spring.sql.init.mode=never
app.data.load.enabled=false

# JWT Configuration for tests
JWT_SECRET=test-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
JWT_EXPIRATION=3600000

# Logging Configuration for tests
logging.level.com.example.demo=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Disable banner for tests
spring.main.banner-mode=off

# Exclude OAuth2 autoconfiguration for tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
