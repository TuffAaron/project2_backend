spring.application.name=project2_backend


# Database Configuration
# For Heroku: Uses JAWSDB_URL environment variable (should be full JDBC URL)
# For Local: Uses H2 in-memory database
spring.datasource.url=${JAWSDB_URL:jdbc:h2:file:./data/nba_games_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${JAWSDB_USERNAME:sa}
spring.datasource.password=${JAWSDB_PASSWORD:}

# JPA/Hibernate Configuration - Optimized for production JawsDB
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false

# Production-optimized connection pool settings
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1200000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION:60000}

# Re-enable data loading for production
app.data.load.enabled=${DATA_LOAD_ENABLED:true}

# H2 Console (for local development only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Session Configuration - Essential for Heroku HTTPS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.timeout=30m

# Base URL Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Exclude OAuth2 autoconfiguration for default local development
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# =================================
# OAUTH2 CLIENT CONFIGURATION
# =================================
# Note: OAuth2 is DISABLED for local development
# OAuth2 is configured in application-prod.properties for Heroku deployment
# To enable locally, add GitHub/Google credentials as environment variables

spring.security.oauth2.client.registration.google.scope=profile,email
# Spring Boot auto-generates redirect-uri as: {baseUrl}/login/oauth2/code/{registrationId}

