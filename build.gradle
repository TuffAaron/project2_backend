plugins {
	id 'groovy'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Project for CST438'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	[apiElements, runtimeElements].each {
		it.outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(jar) }
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	implementation 'org.apache.groovy:groovy'
	
	// JWT dependencies - ADD THESE THREE LINES
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
	useJUnitPlatform()
	// Configure test to use the test profile
	systemProperty 'spring.profiles.active', 'test'
	// Make tests more resilient for CI/CD environments
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
	// Skip tests during Heroku deployment
	enabled = !System.getenv().containsKey('DYNO') && !System.getenv().containsKey('CI')
}

// Heroku deployment task - skip tests, just build JAR
task stage {
	dependsOn 'clean', 'bootJar'
	doLast {
		println "Heroku deployment stage completed successfully"
	}
}

// Disable the plain JAR task to avoid confusion
jar {
	enabled = false
}

// Ensure bootJar creates the correct executable JAR
bootJar {
	archiveClassifier.set('')
	archiveFileName.set('demo-0.0.1-SNAPSHOT.jar')
}

// Alternative: Build without tests
gradle.taskGraph.whenReady { graph ->
	if (System.getenv().containsKey('DYNO') || System.getenv().containsKey('CI')) {
		graph.allTasks.findAll { it.name == 'test' }.each { it.enabled = false }
	}
}
